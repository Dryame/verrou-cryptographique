services:
  postgres:
    image: postgres:16-alpine
    container_name: verrou_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: verrou_db
      POSTGRES_USER: verrou_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # On monte aussi les migrations pour qu'elles soient disponibles si besoin
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verrou_user -d verrou_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: verrou_backend
    restart: unless-stopped
    environment:
      # On utilise 'postgres' (le nom du service) et non 'db'
      DATABASE_URL: postgresql+asyncpg://verrou_user:${POSTGRES_PASSWORD}@postgres:5432/verrou_db
      # On passe la vraie variable attendue par security_middleware.py
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local