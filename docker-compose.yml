version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: verrou_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: verrou_db
      POSTGRES_USER: verrou_user
      POSTGRES_PASSWORD: verrou_secret_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verrou_user -d verrou_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local